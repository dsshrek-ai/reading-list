<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main" class="btn secondary" style="position:absolute;left:-999px;top:0;">Skip to content</a>
<header class="site-header">
  <div class="bar">
    <h1>Reading List</h1>
    <nav>
      <a href="index.html" aria-current="page">Library</a>
      <a href="manage.html">Manage</a>
    </nav>
  </div>
</header>
<main id="main">
  <div id="status"></div>
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Reading List</footer>
<script src="js/api.js"></script>
<script>
  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('status');
  let BOOKS = [];
  const openKeys = new Set();

  function showStatus(msg) {
    if (!msg) { statusEl.style.display = 'none'; return; }
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
  }

  const STATUS_OPTS = ['Not Started', 'Read Some', 'Finished'];

  // Library tree levels, outermost first. "Source" is the book's Type (Kindle / Audible / Hard Copy).
  const LEVELS = [
    { field: 'Author', empty: 'Unknown author' },
    { field: 'Type',   empty: '(No source)' },
    { field: 'Series', empty: '(No series)' },
  ];

  // Split books into groups by one level's field; named groups A-Z, the empty group last.
  function groupBy(books, level) {
    const map = new Map();
    books.forEach(b => {
      const v = (b[level.field] || '').trim();
      if (!map.has(v)) map.set(v, []);
      map.get(v).push(b);
    });
    return [...map.entries()]
      .map(([value, list]) => ({ value, books: list }))
      .sort((x, y) =>
        (x.value === '' ? 1 : 0) - (y.value === '' ? 1 : 0) ||
        x.value.localeCompare(y.value));
  }

  function groupEl(g, depth, parentKey) {
    const level = LEVELS[depth];
    const key = parentKey + ' ||| ' + g.value;
    const roll = rollupStatus(g.books);
    const finished = g.books.filter(b => b.Status === 'Finished').length;

    const wrap = document.createElement('div');
    wrap.className = 'grp lvl-' + depth;
    wrap.dataset.open = openKeys.has(key) ? 'true' : 'false';

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'grp-head';
    head.innerHTML =
      '<span class="chev">&#9656;</span>' +
      '<span class="grp-name">' + escapeHtml(g.value || level.empty) + '</span>' +
      '<span class="badge ' + statusClass(roll) + '">' + roll + '</span>' +
      '<span class="frac">' + finished + '/' + g.books.length + ' read</span>';
    head.addEventListener('click', () => {
      const now = wrap.dataset.open === 'true';
      wrap.dataset.open = now ? 'false' : 'true';
      if (now) openKeys.delete(key); else openKeys.add(key);
    });

    const body = document.createElement('div');
    body.className = 'grp-body';
    if (depth + 1 < LEVELS.length) {
      groupBy(g.books, LEVELS[depth + 1]).forEach(child =>
        body.appendChild(groupEl(child, depth + 1, key)));
    } else {
      g.books
        .slice()
        .sort((x, y) => (x.SortOrder - y.SortOrder) || x.Title.localeCompare(y.Title))
        .forEach(b => body.appendChild(bookRowEl(b)));
    }

    wrap.appendChild(head);
    wrap.appendChild(body);
    return wrap;
  }

  function bookRowEl(b) {
    const row = document.createElement('div');
    row.className = 'book-row';

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = b.SortOrder ? ('#' + b.SortOrder) : '';

    const bt = document.createElement('span');
    bt.className = 'bt';
    bt.innerHTML = escapeHtml(b.Title) + (b.Type ? ' <span class="ty">' + escapeHtml(b.Type) + '</span>' : '');

    const sel = document.createElement('select');
    STATUS_OPTS.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if (o === b.Status) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', async () => {
      sel.disabled = true;
      try {
        const res = await postAction('setStatus', { id: b.Id, status: sel.value });
        if (!res.ok) throw new Error('save failed');
        b.Status = sel.value;
        render();               // refresh rollups
      } catch (e) {
        showStatus("Couldn't save that change. Try again.");
        sel.disabled = false;
      }
    });

    row.appendChild(num);
    row.appendChild(bt);
    row.appendChild(sel);
    if (b.AcquireUrl) {
      const a = document.createElement('a');
      a.className = 'acq';
      a.href = b.AcquireUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Acquire ↗';
      row.appendChild(a);
    }
    return row;
  }

  function render() {
    showStatus('');
    if (!BOOKS.length) {
      contentEl.innerHTML = `
        <div class="card">
          <p>Your reading list is empty.</p>
          <p><button type="button" class="btn" id="seed-btn">Load the Xanth reading list (49 books)</button></p>
          <p class="note">Or add books yourself on the <a href="manage.html">Manage</a> screen.</p>
        </div>`;
      document.getElementById('seed-btn').addEventListener('click', seed);
      return;
    }
    contentEl.innerHTML = '';
    groupBy(BOOKS, LEVELS[0]).forEach(g => contentEl.appendChild(groupEl(g, 0, '')));
  }

  async function seed() {
    const btn = document.getElementById('seed-btn');
    if (btn) btn.disabled = true;
    try {
      const res = await postAction('seedXanth');
      if (!res.ok) throw new Error('seed failed');
      await load();
    } catch (e) {
      showStatus("Couldn't load the Xanth list. Try again.");
      if (btn) btn.disabled = false;
    }
  }

  async function load() {
    try {
      const res = await fetchData('books');
      BOOKS = (res && res.books) || [];
      render();
    } catch (e) {
      handleError(contentEl, e);
    }
  }

  (async () => {
    await captureSso();
    await load();
  })();
</script>
</body>
</html>
